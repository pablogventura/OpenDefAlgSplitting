[project]
name = "OpenDefAlgSplitting"
version = "0.1.0"
description = "Open Definability checker for finite algebras"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "termcolor",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pytest-cov>=4.0",
    "radon>=6.0",
    "pylint>=3.0",
]

[tool.pytest.ini_options]
# Muestra los 15 tests más lentos al final
addopts = "--durations=15"
# Duración mínima (s) para aparecer en el reporte
# duration = 0.5

[tool.ruff]
target-version = "py37"
line-length = 100
src = ["."]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.mccabe]
# Umbral alto (40) para no fallar en código legacy; radon reporta detalles
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
"testing/*" = ["S101"]  # assert allowed in tests
"testing/**/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.radon.cc]
min = "D"  # D=1-5, C=6-10, B=11-20, A=21-50, F=51+ (A-F grados)
exclude = "venv/*,.venv/*,testing/*"
total-average = true

[tool.radon.mi]
min = "B"  # A=20+, B=10-19, C=0-9 (mantenibilidad)

[tool.pylint.messages_control]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.format]
max-line-length = 100

[tool.pyright]
pythonVersion = "3.7"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
