[package]
name = "opendefalgsplitting"
version = "0.1.0"
edition = "2021"
description = "Open Definability checker for finite algebras"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
colored = "2.1"
thiserror = "1.0"
anyhow = "1.0"
flate2 = "1.0"
rayon = "=1.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# cuda-12000 = CUDA 12.0; si usas 11.8 pon "cuda-11080", etc.
cudarc = { version = "0.12", optional = true, features = ["nvrtc", "cuda-12000"] }
