# Compila el binario para Linux y Windows, publica artefactos y crea un Release con los binarios.
name: Build

on:
  push:
    tags:
      - '*'   # cualquier tag (p. ej. v1.0.0)

permissions:
  contents: write   # necesario para crear el Release y subir assets

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build (release)
        run: cargo build --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: opendefalgsplitting-linux-x86_64
          path: target/release/opendefalgsplitting

  build-linux-static:
    name: Linux (estático, musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl

      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (release, estático)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload Linux static binary
        uses: actions/upload-artifact@v4
        with:
          name: opendefalgsplitting-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/opendefalgsplitting

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build (release)
        run: cargo build --release

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: opendefalgsplitting-windows-x86_64
          path: target/release/opendefalgsplitting.exe

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-static, build-windows]
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: opendefalgsplitting-linux-x86_64

      - name: Download Linux static binary
        uses: actions/download-artifact@v4
        with:
          name: opendefalgsplitting-linux-x86_64-musl

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: opendefalgsplitting-windows-x86_64

      - name: Rename and prepare release assets
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p release
          # Artifact layout varies; find the single file in each artifact dir
          mv "$(find opendefalgsplitting-linux-x86_64 -type f)" "release/opendefalgsplitting-${TAG}-linux-x86_64"
          mv "$(find opendefalgsplitting-linux-x86_64-musl -type f)" "release/opendefalgsplitting-${TAG}-linux-x86_64-musl"
          mv "$(find opendefalgsplitting-windows-x86_64 -type f)" "release/opendefalgsplitting-${TAG}-windows-x86_64.exe"
          chmod +x release/opendefalgsplitting-*

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
